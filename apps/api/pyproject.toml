[project]
name = "zuula-api"
version = "0.1.0"
description = "Zuula (Uganda Fact-Guard) API: FastAPI on PostgreSQL + pgvector, with a Celery worker. openapi.yaml is the contract."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "celery[redis]>=5.4",
  # P3 persistence (ADR 0002 §1): async SQLAlchemy on asyncpg, Alembic migrations, pgvector.
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.16",  # alembic.ini uses path_separator (1.16+)
  "pgvector>=0.3.6",
  # P3 auth (ADR 0002 §5): the bcrypt package directly, not the unmaintained passlib.
  "bcrypt>=4.2",
  # P3 real adapters (ADR 0002 §7): httpx for every HTTP integration (OAuth, Africa's Talking,
  # Turnstile, WhatsApp, Telegram), boto3 for S3-compatible storage, aiosmtplib for email.
  "httpx>=0.27",
  "boto3>=1.35",
  "aiosmtplib>=3.0",
  # P4 verdict engine (app/providers/): Groq and Tavily are plain httpx calls (no vendor SDK,
  # same convention as every adapter above), but the three local models need their own
  # packages. trafilatura is the `fetch` step's article extraction (self-hosted, no key).
  # sentence-transformers is the dedupe check's embedding model (all-MiniLM-L6-v2, CPU).
  # transformers is the AI-text detector (RoBERTa, CPU). Both default to a stub
  # (EMBEDDING_PROVIDER/AI_TEXT_DETECTOR_PROVIDER=stub) so routine dev/CI never downloads
  # either model; torch itself comes in transitively via sentence-transformers.
  "trafilatura>=1.12",
  "sentence-transformers>=3.0",
  "transformers>=4.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "openapi-core>=0.19",
  # Not declared by openapi-core itself, but required at runtime by its Starlette/FastAPI
  # contrib middleware (used in tests/contract/) — confirmed missing from a clean install.
  "aioitertools>=0.11",
  # tests/pipeline/ — a fake Redis (sync + async) so the pipeline/realtime tests don't need
  # a live Redis server.
  "fakeredis>=2.26",
  # tests/adapters/ — mocks httpx so no adapter test calls a real service.
  "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Sample data stays one object per line (see the E501 ignore below), so the formatter skips it.
exclude = ["app/db/sample_data/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP047: stick to typing.TypeVar rather than PEP 695 `def f[T](...)` syntax for now — this
# sandbox's dev Python is 3.11 (the container image is 3.12), and TypeVar reads identically on
# both. Revisit once local dev also runs 3.12.
ignore = ["UP047"]

[tool.ruff.lint.per-file-ignores]
# Sample data files are intentionally one-object-per-line for reviewability against the TS
# mocks they're transliterated from; wrapping each one would make the diff harder to audit.
"app/db/sample_data/*.py" = ["E501"]
# Contract test cases are one-request-per-line for readability against the endpoints they
# exercise; wrapping each json= payload would make the test list harder to scan.
"tests/contract/*.py" = ["E501"]
"tests/pipeline/*.py" = ["E501"]
"tests/adapters/*.py" = ["E501"]
# Autogenerated migrations: long op.create_index(...) lines are left as Alembic wrote them.
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
