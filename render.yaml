# Render Blueprint: the Zuula API on one free web service (Milestone B, docs/zuula_state.md
# §11, option 1). Background jobs run inside the API (JOB_RUNNER=inline): Render's free plan
# has no background workers. Email goes over Brevo's HTTPS API: free services can't use SMTP.
# Redis is Upstash's free plan (Frankfurt, TLS): Render allows one free Key Value per
# workspace, and the older `zuula-redis` holds it. With jobs inline, Redis only carries live
# status updates and the sign-in lockout, well within Upstash's 500K commands a month.
#
# The API lives in Frankfurt, the nearest Render region to Supabase (eu-west-1, Ireland). The
# older `zuula-api` / `zuula-redis` in Ohio predate this file and aren't managed by it.
#
# `sync: false` values are secrets: Render asks for them when the Blueprint is applied, and
# they live only in Render's dashboard, never in git. No pre-deploy migration step on purpose:
# production migrations are run by hand, with Noah's go-ahead.
services:
  - type: web
    name: zuula-api-eu
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # ---- App ----
      - key: ZUULA_ENV
        value: production
      - key: ZUULA_DEBUG
        value: "false"
      - key: ZUULA_SECRET_KEY
        generateValue: true
      - key: ZUULA_SESSION_COOKIE_SECURE
        value: "true"
      - key: ZUULA_CORS_ORIGINS # the web app's exact origins, comma-separated
        sync: false
      - key: ZUULA_WEB_APP_URL
        sync: false
      # Integrations not set up yet run as stubs (docs/zuula_state.md §11). Remove each one
      # from this list as its credentials are added.
      - key: ZUULA_ALLOW_STUB_ADAPTERS
        value: google,facebook,sms,turnstile,clamav,s3,whatsapp,telegram

      # ---- Database (Supabase, IPv4 session pooler; postgresql+asyncpg://...) ----
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"

      # ---- Sign-in (Supabase Auth) ----
      - key: ZUULA_AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        value: https://xskkttjlgkanopzivfpy.supabase.co
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ---- Jobs and Redis ----
      - key: JOB_RUNNER
        value: inline
      - key: REDIS_URL # Upstash: rediss://default:<password>@<host>.upstash.io:6379
        sync: false

      # ---- Email (Brevo HTTPS API) ----
      - key: EMAIL_FROM
        value: zuulaug@gmail.com
      - key: BREVO_API_KEY
        sync: false

      # ---- File storage (Supabase Storage's S3 endpoint; one private bucket) ----
      # Uploads and accreditation documents are only ever read by the API (admins get signed
      # links to it), so both live in the private bucket. Keys: Supabase → Storage → S3.
      # Remove s3 from ZUULA_ALLOW_STUB_ADAPTERS once both keys are set.
      - key: S3_ENDPOINT_URL
        value: https://xskkttjlgkanopzivfpy.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: eu-west-1
      - key: S3_BUCKET
        value: zuula-documents
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # ---- AI engine: hosted services; the local models stay off on 512 MB ----
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Fallbacks when Groq fails, in this order (each only when its key is set).
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SUNBIRD_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: stub
      - key: AI_TEXT_DETECTOR_PROVIDER
        value: stub
      - key: DEEPFAKE_DETECTOR_PROVIDER
        value: stub
      - key: METADATA_TAMPERING_PROVIDER
        value: stub
